<!DOCTYPE html>
<html>

<head>

    <title>Register - JobReady</title>

    <link rel="stylesheet" href="/static/style.css">

</head>

<body>

<div class="form-box">

    <h1>Create Account</h1>

    <form method="POST">

        <input
            type="text"
            name="name"
            placeholder="Full Name"
            required
        >

        <input
            type="email"
            name="email"
            placeholder="Email"
            required
        >

        <input
            type="password"
            name="password"
            placeholder="Password"
            required
        >

        <button type="submit">
            Register
        </button>

    </form>


    <p>
        Already have an account?
        <a href="/login">Login</a>
    </p>

</div>

</body>

</html>
