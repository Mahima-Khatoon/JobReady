<!DOCTYPE html>
<html>

<head>

    <title>Aptitude Practice - JobReady</title>

    <link rel="stylesheet" href="/static/style.css">

</head>

<body>

<nav>

    <h2>JobReady</h2>

    <div>

        <a href="/dashboard">Dashboard</a>
        <a href="/logout">Logout</a>

    </div>

</nav>


<div class="container">

    <h1>Aptitude Practice 📝</h1>


    <div class="card">

        <h3>Question 1</h3>

        <p>
            If 10 + 20 = 30, what is 30 + 40?
        </p>


        <label>
            <input type="radio" name="q1" value="60">
            A. 60
        </label>


        <label>
            <input type="radio" name="q1" value="70">
            B. 70
        </label>


        <label>
            <input type="radio" name="q1" value="80">
            C. 80
        </label>


        <label>
            <input type="radio" name="q1" value="90">
            D. 90
        </label>

    </div>


    <div class="card">

        <h3>Question 2</h3>

        <p>
            What is 20% of 100?
        </p>


        <label>
            <input type="radio" name="q2" value="10">
            A. 10
        </label>


        <label>
            <input type="radio" name="q2" value="15">
            B. 15
        </label>


        <label>
            <input type="radio" name="q2" value="20">
            C. 20
        </label>


        <label>
            <input type="radio" name="q2" value="25">
            D. 25
        </label>

    </div>


    <button type="button" onclick="checkScore()">
        Submit Test
    </button>


    <div id="result"></div>

</div>


<script>

function checkScore() {

    let score = 0;

    let q1 =
        document.querySelector(
            'input[name="q1"]:checked'
        );

    let q2 =
        document.querySelector(
            'input[name="q2"]:checked'
        );


    if (q1 && q1.value === "70") {
        score++;
    }


    if (q2 && q2.value === "20") {
        score++;
    }


    document.getElementById("result").innerHTML =
        "<div class='card'>" +
        "<h2>Your Score: " +
        score +
        "/2</h2>" +
        "</div>";

}

</script>

</body>

</html>
